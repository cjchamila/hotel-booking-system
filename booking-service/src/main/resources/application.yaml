server:
  port: 8081
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking-service-db
    username: postgres
    password: chamilaRoot@123

  jpa:
    hibernate:
      ddl-auto: update


  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [corrId=%X{correlationId}] %-5level %logger - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always