
  version: '2' #docker compose version
  services:
    zookeeper:
      image: confluentinc/cp-zookeeper:7.4.4
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181 #listends to kafka on this port
        ZOOKEEPER_TICK_TIME: 2000
      ports:
        - "22181:2181" #HOST : CONTAINER eg. localhost:22181 (external)

    kafka:
      image: confluentinc/cp-kafka:7.4.4
      depends_on:
        - zookeeper #start zookeeper before kafka
      ports:
        - "29092:29092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 #Inside docker network -Kafka container → zookeeper container
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092 #kafka:9092 -> for Docker containers
                                                                                            #localhost:29092 -> for applications running on host machine
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1